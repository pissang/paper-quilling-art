  <use xlink:href="#wings" transform="translate(600 0) scale(-1 1)" />
  <!-- Body and antennae -->
  <ellipse cx="300" cy="320" rx="16" ry="110" fill="#3a2a2a" />
  <circle cx="300" cy="200" r="20" fill="#3a2a2a" />
  <path d="M 292 186 C 270 140 250 120 228 112" fill="none" stroke="#3a2a2a" stroke-width="6" stroke-linecap="round" />
  <path d="M 308 186 C 330 140 350 120 372 112" fill="none" stroke="#3a2a2a" stroke-width="6" stroke-linecap="round" />
  <circle cx="226" cy="110" r="9" fill="#3a2a2a" />
  <circle cx="374" cy="110" r="9" fill="#3a2a2a" />
</svg>
